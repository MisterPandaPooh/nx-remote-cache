## Values for nx-remote-cache. Built on bitnami/common, so the usual Bitnami knobs are here too
## (global.imageRegistry, commonLabels, resourcesPreset, podAntiAffinityPreset, extraDeploy ...).
## Server reference: https://github.com/MisterPandaPooh/nx-remote-cache/blob/main/docs/configuration.md

## @section Store: where artifacts live
store:
  ## azure | s3 | gcs | filesystem | memory
  type: azure
  ## Optional folder inside the container / bucket (artifacts become <prefix>/<hash>)
  prefix: ""
  ## Advanced: a full store URL (az://, s3://, gs://, file://, memory:///) that replaces the typed settings
  ## below for the URL only; credentials still come from the matching block.
  url: ""
  ## Store client: per-request timeout, connect timeout, retries on transient errors
  timeoutSeconds: 300
  connectTimeoutSeconds: 5
  maxRetries: 3

  azure:
    accountName: ""
    container: nx-cache
    ## workloadIdentity | managedIdentity | accountKey | sasToken | servicePrincipal | emulator
    auth: workloadIdentity
    ## AKS Workload Identity: the managed identity's client id. The chart annotates the ServiceAccount
    ## and labels the pods; grant the identity "Storage Blob Data Contributor" on the container.
    workloadIdentity:
      clientId: ""
    ## System- or user-assigned managed identity on the node (IMDS); clientId only for user-assigned.
    managedIdentity:
      clientId: ""
    ## Static credentials. Prefer existingSecret; inline values are written into a chart-managed secret.
    accountKey: ""
    sasToken: ""
    servicePrincipal:
      clientId: ""
      tenantId: ""
      clientSecret: ""
    ## Azurite, for development
    emulator:
      endpoint: http://azurite:10000/devstoreaccount1
    ## Secret with AZURE_STORAGE_ACCOUNT_KEY, AZURE_STORAGE_SAS_TOKEN or AZURE_CLIENT_SECRET
    existingSecret: ""

  s3:
    bucket: ""
    region: ""
    ## MinIO, Cloudflare R2, S3Mock ... (leave empty for AWS)
    endpoint: ""
    allowHttp: false
    ## irsa | instanceProfile | accessKey
    auth: irsa
    ## EKS IRSA: the role to assume; the chart annotates the ServiceAccount.
    irsa:
      roleArn: ""
    accessKeyId: ""
    secretAccessKey: ""
    sessionToken: ""
    ## Secret with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and optionally AWS_SESSION_TOKEN
    existingSecret: ""

  gcs:
    bucket: ""
    ## workloadIdentity | serviceAccountKey
    auth: workloadIdentity
    ## GKE Workload Identity: the Google service account bound to the Kubernetes one
    workloadIdentity:
      gcpServiceAccount: ""
    ## Service account key, JSON
    serviceAccountKey: ""
    ## Secret with GOOGLE_SERVICE_ACCOUNT_KEY
    existingSecret: ""

  ## filesystem: a volume mounted at persistence.mountPath (persistence.enabled must be true)
  ## memory: nothing to configure, artifacts vanish with the pod

## @section Tokens
auth:
  ## false sets NX_CACHE_ENABLE_LOGIN=false: no token for the cache API, no login screen on the
  ## dashboard, works out of the box. Private networks only.
  enabled: true
  ## Read-write token, used on trusted branches. Generated and kept across upgrades when empty.
  token: ""
  ## Read-only token for pull requests (PUT answers 403). Generated when empty.
  readToken: ""
  ## Your own secret instead; the two keys below name its entries.
  existingSecret: ""
  existingSecretTokenKey: NX_CACHE_TOKEN
  existingSecretReadTokenKey: NX_CACHE_READ_TOKEN

## @section Server settings
server:
  uploads:
    ## Largest accepted artifact (413 above)
    maxArtifactSize: 2GB
    ## Up to this size an upload is one atomic create; above, a streamed multipart upload
    inlineThreshold: 8MB
    ## Multipart part size (at least 5MB) and parts in flight per upload
    multipartChunkSize: 8MB
    multipartConcurrency: 4
    ## Uploads in flight per pod. Memory for uploads is bounded by
    ## maxConcurrentPuts × max(inlineThreshold, multipartChunkSize × multipartConcurrency): 16 × 32 MB here.
    maxConcurrentPuts: 16
  ## Hot artifacts served from RAM, no store round trip
  memoryTier:
    enabled: true
    size: 256MB
    maxItemSize: 4MB
  ## /v1/kv, the key-value store for CI glue (NX_CACHE_KV_ENABLED)
  kv:
    enabled: true
    ## memory: an LRU in each pod (fast, gone on restart, one view per pod). redis: shared by every
    ## replica; set redis.url or redis.existingSecret.
    backend: memory
    redis:
      ## redis://[:password@]host:6379/0 or rediss://...; ends up in a chart-managed secret
      url: ""
      ## or a secret of yours holding the URL
      existingSecret: ""
      existingSecretKey: NX_CACHE_KV_REDIS_URL
      ## first part of every key, so one Redis can serve several caches
      prefix: nxrc:kv
    size: 64MB
    maxValueSize: 1MB
  ## Built-in sweeper. Prefer a lifecycle policy on the bucket for TTLs of a day or more.
  retention:
    ## e.g. 30d; empty keeps artifacts forever
    ttl: ""
    ## e.g. 500GB; the oldest artifacts are deleted down to 90 % of it
    maxTotalSize: ""
    sweepInterval: 1h
  dashboard:
    enabled: true
    ## Dedicated dashboard token; empty lets any cache token open the dashboard
    token: ""
    existingSecret: ""
    existingSecretKey: NX_CACHE_UI_TOKEN
    ## Header set by an SSO proxy (X-Auth-Request-Email): only expose the server through that proxy
    trustedHeader: ""
  ## CI integration: run and repository context becomes links in the dashboard. GitHub only so far.
  github:
    enabled: true
    ## GitHub Enterprise Server base URL, if not github.com
    url: ""
  logging:
    ## error | warn | info | debug | trace | off
    level: info
    ## json | pretty | compact
    format: json
    ## One info line per request (otherwise requests log at debug, failures at warn)
    accessLog: false
    ## Fine-grained tracing filter (RUST_LOG), overrides level: "info,access=debug,object_store=trace"
    filter: ""
  ## Seconds in-flight requests may finish after SIGTERM
  shutdownGraceSeconds: 20
  ## Anything else, as NAME: value
  extraEnv: {}

## Extra env entries (valueFrom, secretKeyRef ...), templated
extraEnvVars: []
## ConfigMap and Secret whose keys become environment variables
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

## @section Persistence (store.type: filesystem)
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 50Gi
  annotations: {}
  mountPath: /data

## @section Image
image:
  registry: ghcr.io
  repository: misterpandapooh/nx-remote-cache
  ## Bumped by the release workflow. Docker Hub mirror: registry docker.io, same repository.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section Deployment
replicaCount: 2
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
revisionHistoryLimit: 3
podLabels: {}
podAnnotations: {}
podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
automountServiceAccountToken: false
hostAliases: []

podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 65534
containerSecurityContext:
  enabled: true
  seLinuxOptions: {}
  runAsUser: 65534
  runAsGroup: 65534
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

## Bitnami preset (nano, micro, small, medium, large, xlarge, 2xlarge) or explicit resources.
## With the upload defaults above, 1Gi of memory is a comfortable limit.
resourcesPreset: "small"
resources: {}
#  requests: { cpu: 100m, memory: 64Mi }
#  limits: { memory: 1Gi }

livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  enabled: true
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1
startupProbe:
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
  successThreshold: 1
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

## @section Traffic exposure
service:
  type: ClusterIP
  ports:
    http: 80
  nodePorts:
    http: ""
  clusterIP: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  sessionAffinityConfig: {}
  extraPorts: []
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"

ingress:
  enabled: false
  ingressClassName: ""
  pathType: Prefix
  hostname: nx-cache.local
  path: /
  ## Big artifacts need a large body limit, no request buffering and long timeouts (nginx shown).
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  ## TLS with a secret named <hostname>-tls (cert-manager annotations honoured)
  tls: false
  selfSigned: false
  extraHosts: []
  extraPaths: []
  extraTls: []
  secrets: []
  extraRules: []

## @section Other
pdb:
  create: true
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70
  targetMemory: ""

serviceAccount:
  create: true
  name: ""
  ## Cloud identity annotations are added from store.* automatically; extra ones go here.
  annotations: {}
  automountServiceAccountToken: false

metrics:
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: ""
    labels: {}
    selector: {}
    relabelings: []
    metricRelabelings: []
    honorLabels: false
    jobLabel: ""

## @section Global and common parameters (Bitnami)
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  compatibility:
    openshift:
      adaptSecurityContext: auto
kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}
clusterDomain: cluster.local
extraDeploy: []
