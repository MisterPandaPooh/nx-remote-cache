{{- if and (eq (include "nx-remote-cache.kvBackend" .) "redis") .Values.server.kv.redis.url (not .Values.server.kv.redis.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-kv" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  NX_CACHE_KV_REDIS_URL: {{ .Values.server.kv.redis.url | b64enc | quote }}
{{- end }}
