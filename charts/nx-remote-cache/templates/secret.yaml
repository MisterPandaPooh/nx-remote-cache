{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $secretName := include "nx-remote-cache.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # Generated once (48 random characters) and kept across upgrades when not provided in values.
  NX_CACHE_TOKEN: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "NX_CACHE_TOKEN" "providedValues" (list "auth.token") "length" 48 "strong" false "chartName" .Chart.Name "context" $) }}
  NX_CACHE_READ_TOKEN: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "NX_CACHE_READ_TOKEN" "providedValues" (list "auth.readToken") "length" 48 "strong" false "chartName" .Chart.Name "context" $) }}
  {{- if and .Values.server.dashboard.token (not .Values.server.dashboard.existingSecret) }}
  NX_CACHE_UI_TOKEN: {{ .Values.server.dashboard.token | b64enc | quote }}
  {{- end }}
{{- end }}
