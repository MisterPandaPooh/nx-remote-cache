# One-hop rewrite of virtual-hosted-style S3 requests (Host: nx-cache.s3) into the path-style
# form S3Mock understands (/nx-cache/...). Only servers without a path-style option use it.
server {
    listen 9090;
    # Docker DNS, re-resolved: the s3 container is recreated between targets.
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    location / {
        proxy_set_header Host s3:9090;
        proxy_set_header Connection "";
        proxy_pass http://s3:9090/nx-cache$request_uri;
    }
}
