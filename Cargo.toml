[package]
name = "nx-remote-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fast, self-hosted Nx remote cache server: Azure Blob, S3, GCS or local disk behind the official Nx cache API"
license = "MIT"
repository = "https://github.com/MisterPandaPooh/nx-remote-cache"
default-run = "nx-remote-cache"
build = "build.rs"

[lib]
name = "nx_remote_cache"
path = "src/lib.rs"

[[bin]]
name = "nx-remote-cache"
path = "src/main.rs"

[[bin]]
name = "nx-cache-bench"
path = "src/bin/bench.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mime_guess = "2"
object_store = { version = "0.14", default-features = false, features = ["fs", "azure-base", "aws-base", "gcp-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rust-embed = { version = "8", features = ["include-exclude"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
