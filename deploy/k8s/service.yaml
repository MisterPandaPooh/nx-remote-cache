apiVersion: v1
kind: Service
metadata:
  name: nx-remote-cache
  labels:
    app.kubernetes.io/name: nx-remote-cache
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"
spec:
  selector:
    app.kubernetes.io/name: nx-remote-cache
  ports:
    - name: http
      port: 80
      targetPort: http
