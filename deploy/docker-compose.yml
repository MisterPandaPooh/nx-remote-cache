# Local stack: the server against Azurite (Azure Blob emulator).
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]
  cache:
    build: ..
    depends_on: [azurite]
    ports: ["3000:3000"]
    environment:
      NX_CACHE_STORE_URL: az://nx-cache/
      AZURE_STORAGE_USE_EMULATOR: "true"
      AZURE_STORAGE_ENDPOINT: http://azurite:10000/devstoreaccount1
      AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
      AZURE_STORAGE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      NX_CACHE_TOKEN: dev-token
      NX_CACHE_LOG_FORMAT: pretty
