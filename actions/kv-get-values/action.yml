name: nx-remote-cache kv-get-values
description: >-
  Read values from the key-value store of an nx-remote-cache server, scoped to the whole cache,
  to this repository or to this workflow run. Values come back as a JSON object and, on request,
  as environment variables for the following steps. Values stored as secrets are masked.
author: MisterPandaPooh
branding:
  icon: database
  color: blue
inputs:
  server:
    description: Base URL of the cache server, e.g. https://nx-cache.example.com
    required: true
  token:
    description: Bearer token (read-only is enough)
    required: true
  level:
    description: "Isolation: global (every job), pipeline (this repository) or run (this workflow run)"
    default: global
  keys:
    description: Newline-separated keys to read
    required: true
  required:
    description: "true: fail the step when a key is missing; false: missing keys are simply absent"
    default: "false"
  export-env:
    description: "true: also export every value as an environment variable for the next steps"
    default: "false"
  env-prefix:
    description: Prefix for the exported variable names (key characters other than letters and digits become `_`)
    default: KV_
outputs:
  values:
    description: JSON object of the keys that were found, `{"key":"value",...}`
    value: ${{ steps.get.outputs.values }}
  found:
    description: Number of keys found
    value: ${{ steps.get.outputs.found }}
runs:
  using: composite
  steps:
    - id: get
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_LEVEL: ${{ inputs.level }}
        INPUT_KEYS: ${{ inputs.keys }}
        INPUT_REQUIRED: ${{ inputs.required }}
        INPUT_EXPORT_ENV: ${{ inputs.export-env }}
        INPUT_ENV_PREFIX: ${{ inputs.env-prefix }}
      run: bash "${{ github.action_path }}/kv-get.sh"
