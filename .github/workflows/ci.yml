name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the image job may push to ghcr.io.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      s3mock:
        image: adobe/s3mock:latest
        ports: ["9090:9090"]
        env:
          initialBuckets: nx-cache
    env:
      NX_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/
      NX_CACHE_TEST_S3_URL: s3://nx-cache/
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://127.0.0.1:9090
      AWS_ALLOW_HTTP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The binary embeds ui/dist; build it so the tests exercise the dashboard that ships.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: ui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Action scripts against a local server
        run: |
          cargo build --locked
          NX_CACHE_STORE_URL=memory:/// NX_CACHE_TOKEN=ci-token PORT=3999 target/debug/nx-remote-cache &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3999/healthz').status == 200 else 1)" 2>/dev/null; then
              ready=1; break
            fi
            sleep 0.2
          done
          [ "${ready:-0}" = 1 ] || { echo "server did not become ready"; exit 1; }
          bash actions/test.sh http://127.0.0.1:3999 ci-token

  ui:
    name: Dashboard (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  helm:
    name: Helm chart (lint, template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm dependency build charts/nx-remote-cache
      - run: helm lint charts/nx-remote-cache --strict --set store.type=memory --set replicaCount=1
      - name: Render the common configurations
        run: |
          set -euo pipefail
          C=charts/nx-remote-cache
          helm template t $C --set store.type=memory --set replicaCount=1 > /dev/null
          helm template t $C --set store.azure.accountName=acct --set store.azure.workloadIdentity.clientId=cid \
            --set auth.existingSecret=tokens --set server.dashboard.existingSecret=dashboard \
            --set ingress.enabled=true --set ingress.hostname=nx.example.com --set ingress.tls=true \
            --set autoscaling.enabled=true --set metrics.serviceMonitor.enabled=true > /dev/null
          helm template t $C --set store.azure.accountName=acct --set store.azure.auth=accountKey --set store.azure.accountKey=k > /dev/null
          helm template t $C --set store.type=s3 --set store.s3.bucket=b --set store.s3.region=eu-west-1 \
            --set store.s3.auth=accessKey --set store.s3.accessKeyId=a --set store.s3.secretAccessKey=s --set store.s3.endpoint=http://minio:9000 --set store.s3.allowHttp=true > /dev/null
          helm template t $C --set store.type=s3 --set store.s3.bucket=b --set store.s3.region=eu-west-1 --set store.s3.irsa.roleArn=arn:aws:iam::1:role/x > /dev/null
          echo '{"type":"service_account"}' > sa.json
          helm template t $C --set store.type=gcs --set store.gcs.bucket=b --set store.gcs.auth=serviceAccountKey --set-file store.gcs.serviceAccountKey=sa.json > /dev/null
          helm template t $C --set store.type=filesystem --set persistence.enabled=true --set replicaCount=1 --set auth.enabled=false \
            --set server.kv.enabled=false --set server.memoryTier.enabled=false --set server.retention.ttl=30d --set resources.limits.memory=1Gi > /dev/null
          helm template t $C --set store.type=filesystem --set persistence.enabled=true --set persistence.accessModes={ReadWriteMany} > /dev/null
          # must refuse incomplete, unknown or contradictory settings
          for args in "--set store.type=filesystem" "--set store.type=azure" "--set store.type=s3 --set store.s3.bucket=b" "--set store.type=bogus" "--set store.type=memory" \
            "--set store.type=memory --set autoscaling.enabled=true" "--set store.type=filesystem --set persistence.enabled=true" \
            "--set store.type=memory --set replicaCount=1 --set auth.existingSecret=tokens --set server.dashboard.token=ui"; do
            if helm template t $C $args > /dev/null 2>&1; then echo "expected a validation failure for: $args" >&2; exit 1; fi
          done
      - run: python3 scripts/release.py check "$(python3 scripts/release.py current)"

  image:
    # One native build per platform (arm64 on GitHub's free arm runners: a Rust release build under
    # QEMU takes an hour), pushed by digest; the manifest job stitches the multi-arch tags.
    name: Docker image (${{ matrix.platform }})
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/misterpandapooh/nx-remote-cache,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Record the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests && touch "digests/${DIGEST#sha256:}"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Docker image (multi-arch tags)
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/misterpandapooh/nx-remote-cache
          tags: |
            type=ref,event=branch
            type=sha
      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/misterpandapooh/nx-remote-cache@sha256:%s ' $(ls digests))
          docker buildx imagetools inspect "ghcr.io/misterpandapooh/nx-remote-cache:${DOCKER_METADATA_OUTPUT_VERSION}"
