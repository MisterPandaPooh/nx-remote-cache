name: Release

# Two ways in, one path out:
#   - Actions → Release → Run workflow with a version: bumps every versioned file, commits, tags, releases.
#   - git push of a tag vX.Y.Z (the files must already say X.Y.Z).
# Then: multi-arch image on ghcr.io and Docker Hub (signed, with SBOM and provenance), Helm chart on
# ghcr.io (signed), static binaries and release notes on a GitHub Release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z). Bumps the files, commits and tags vX.Y.Z on main."
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_GHCR: ghcr.io/misterpandapooh/nx-remote-cache
  IMAGE_HUB: docker.io/misterpandapooh/nx-remote-cache
  CHART_OCI: oci://ghcr.io/misterpandapooh/charts

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - name: Bump, commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists" >&2; exit 1
          fi
          python3 scripts/release.py bump "$VERSION"
          python3 scripts/release.py check "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "release: v$VERSION"
          fi
          git tag -a "v$VERSION" -m "nx-remote-cache $VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Check the tag matches the files (tag push)
        if: github.event_name == 'push'
        run: python3 scripts/release.py check "${GITHUB_REF_NAME#v}"
      - id: v
        run: |
          echo "version=$(python3 scripts/release.py current)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  image:
    name: Image (ghcr.io, Docker Hub)
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_HUB }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.prepare.outputs.version }},enable=${{ !startsWith(needs.prepare.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=nx-remote-cache
            org.opencontainers.image.description=Free, self-hosted remote cache server for Nx
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign both images (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_GHCR@$DIGEST" "$IMAGE_HUB@$DIGEST"
      - name: Extract static binaries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            id=$(docker create --platform "linux/$arch" "$IMAGE_GHCR@$DIGEST")
            docker cp "$id:/nx-remote-cache" "dist/nx-remote-cache"
            docker rm "$id" >/dev/null
            tar -C dist -czf "dist/nx-remote-cache-$VERSION-linux-$arch.tar.gz" nx-remote-cache
            rm dist/nx-remote-cache
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  chart:
    name: Helm chart (ghcr.io)
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          helm dependency build charts/nx-remote-cache
          helm lint charts/nx-remote-cache --set storeUrl=memory:///
          helm template t charts/nx-remote-cache --set storeUrl=memory:/// >/dev/null
          mkdir -p dist
          helm package charts/nx-remote-cache --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push and sign
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/nx-remote-cache-$VERSION.tgz" "$CHART_OCI" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          echo "chart digest $digest"
          echo "$digest" > dist/chart.digest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the chart (keyless, Sigstore)
        run: cosign sign --yes "ghcr.io/misterpandapooh/charts/nx-remote-cache@$(cat dist/chart.digest)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/release.py notes "$VERSION" > notes.md
          printf '\nImage digest: `%s`\n' "$DIGEST" >> notes.md
          prerelease=""; case "$VERSION" in *-*) prerelease="--prerelease";; esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file notes.md $prerelease
          fi
