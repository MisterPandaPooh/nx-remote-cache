name: Release

# Two ways in, one path out:
#   - Actions → Release → Run workflow with a version: bumps every versioned file, commits, tags, releases.
#   - git push of a tag vX.Y.Z (the files must already say X.Y.Z).
# Then: multi-arch image on ghcr.io and Docker Hub (signed, with SBOM and provenance), Helm chart on
# ghcr.io (signed), static binaries and release notes on a GitHub Release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z). Bumps the files, commits and tags vX.Y.Z on main."
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_GHCR: ghcr.io/misterpandapooh/nx-remote-cache
  IMAGE_HUB: docker.io/misterpandapooh/nx-remote-cache
  CHART_OCI: oci://ghcr.io/misterpandapooh/charts

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    # The environment's reviewers approve before the release commit and tag exist, so a
    # refused release does not burn a version.
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - name: Bump, commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # Re-publishing an existing version (a failed job after the tag): the files must already
            # say so and the tag must be on main; nothing is bumped or moved.
            python3 scripts/release.py check "$VERSION"
            git merge-base --is-ancestor "v$VERSION" HEAD || { echo "tag v$VERSION is not on main" >&2; exit 1; }
            echo "tag v$VERSION exists, publishing again from main"
            exit 0
          fi
          python3 scripts/release.py bump "$VERSION"
          python3 scripts/release.py check "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "release: v$VERSION"
          fi
          git tag -a "v$VERSION" -m "nx-remote-cache $VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Check the tag matches the files (tag push)
        if: github.event_name == 'push'
        run: python3 scripts/release.py check "${GITHUB_REF_NAME#v}"
      - id: v
        run: |
          echo "version=$(python3 scripts/release.py current)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    # Nothing is published from a commit that does not pass the same gate as CI.
    name: Rust (fmt, clippy, test)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NX_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: ui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    # One native build per platform (arm64 on GitHub's arm runners), pushed by digest to both
    # registries; the manifest job stitches the version tags, signs them and extracts the binaries.
    name: Image (${{ matrix.platform }})
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=nx-remote-cache
            org.opencontainers.image.description=Free, self-hosted remote cache server for Nx
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          outputs: type=image,"name=${{ env.IMAGE_GHCR }},${{ env.IMAGE_HUB }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests && touch "digests/${DIGEST#sha256:}"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Image tags, signatures, binaries
    needs: [prepare, image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_HUB }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.prepare.outputs.version }},enable=${{ !startsWith(needs.prepare.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
      - name: Create the multi-arch tags in both registries
        run: |
          set -euo pipefail
          for image in "$IMAGE_GHCR" "$IMAGE_HUB"; do
            docker buildx imagetools create \
              $(jq -cr --arg img "$image" '.tags | map(select(startswith($img + ":"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf "$image@sha256:%s " $(ls digests))
          done
      - id: digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ghcr=$(docker buildx imagetools inspect "$IMAGE_GHCR:$VERSION" --format '{{.Manifest.Digest}}')
          hub=$(docker buildx imagetools inspect "$IMAGE_HUB:$VERSION" --format '{{.Manifest.Digest}}')
          echo "digest=$ghcr" >> "$GITHUB_OUTPUT"
          echo "hub_digest=$hub" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign both images (keyless, Sigstore)
        env:
          GHCR_DIGEST: ${{ steps.digest.outputs.digest }}
          HUB_DIGEST: ${{ steps.digest.outputs.hub_digest }}
        run: |
          cosign sign --yes "$IMAGE_GHCR@$GHCR_DIGEST"
          cosign sign --yes "$IMAGE_HUB@$HUB_DIGEST"
      - name: Extract static binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            id=$(docker create --platform "linux/$arch" "$IMAGE_GHCR:$VERSION")
            docker cp "$id:/nx-remote-cache" "dist/nx-remote-cache"
            docker rm "$id" >/dev/null
            tar -C dist -czf "dist/nx-remote-cache-$VERSION-linux-$arch.tar.gz" nx-remote-cache
            rm dist/nx-remote-cache
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  chart:
    name: Helm chart (ghcr.io)
    needs: [prepare, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          helm dependency build charts/nx-remote-cache
          helm lint charts/nx-remote-cache --strict --set store.type=memory --set replicaCount=1
          helm template t charts/nx-remote-cache --set store.type=memory --set replicaCount=1 >/dev/null
          mkdir -p dist
          helm package charts/nx-remote-cache --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push and sign
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/nx-remote-cache-$VERSION.tgz" "$CHART_OCI" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          echo "chart digest $digest"
          echo "$digest" > dist/chart.digest
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        # cosign reads the Docker credential store, not Helm's registry config
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the chart (keyless, Sigstore)
        run: cosign sign --yes "ghcr.io/misterpandapooh/charts/nx-remote-cache@$(cat dist/chart.digest)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, manifest, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "!digests-*"
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/release.py notes "$VERSION" > notes.md
          printf '\nImage digest: `%s`\n' "$DIGEST" >> notes.md
          prerelease=""; case "$VERSION" in *-*) prerelease="--prerelease";; esac
          # Published assets are never replaced: a re-run cannot swap the binaries under an
          # existing release. Delete the release by hand to publish it again.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; delete it first to publish again" >&2
            exit 1
          fi
          gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file notes.md $prerelease
